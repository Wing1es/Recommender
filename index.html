<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon AI Omni-Feed Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Minimalist Black and White Theme */
        body {
            background-color: #ffffff;
            color: #000000;
        }

        .bw-input {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 0;
        }

        .bw-input:focus {
            outline: none;
            box-shadow: 4px 4px 0px #000000;
        }

        .bw-button {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }

        .bw-button:hover:not(:disabled) {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 4px 4px 0px #000000;
        }

        .bw-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bw-card {
            background-color: #ffffff;
            border: 2px solid #000000;
            box-shadow: 6px 6px 0px #000000;
        }

        .bw-item-card {
            background-color: #ffffff;
            border: 2px solid #000000;
            transition: all 0.2s;
        }

        .bw-item-card:hover {
            box-shadow: 4px 4px 0px #000000;
            transform: translate(-2px, -2px);
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 font-mono antialiased">

    <div class="max-w-7xl mx-auto space-y-12">

        <!-- Header -->
        <header class="text-center space-y-4 mb-12 border-b-4 border-black pb-8">
            <h1 class="text-5xl font-extrabold uppercase tracking-tighter">
                Horizon Playground
            </h1>
            <p class="text-lg font-bold">Simulate interactions & view the Omni-Feed</p>
        </header>

        <!-- Top Controls -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Simulate Section -->
            <div class="lg:col-span-2 bw-card p-8">
                <h2 class="text-2xl font-black mb-6 uppercase border-b-2 border-black pb-2">1. Simulate Interaction</h2>

                <form id="simulateForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-bold uppercase block">User ID</label>
                        <input type="text" id="simUser" value="test_user_1" class="w-full bw-input px-4 py-3">
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-bold uppercase block">Content Type</label>
                        <!-- Removed Club, Brand, User, and Reel -->
                        <select id="simType" class="w-full bw-input px-4 py-3">
                            <option value="post">Post</option>
                            <option value="event">Event</option>
                            <option value="news">News</option>
                        </select>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="text-sm font-bold uppercase block">Text / Description</label>
                        <textarea id="simText" rows="2" placeholder="e.g. Just launched our new AI event!"
                            class="w-full bw-input px-4 py-3"></textarea>
                    </div>

                    <div id="mediaFieldContainer" class="space-y-4 md:col-span-2 hidden">
                        <div>
                            <span class="text-sm font-bold uppercase block mb-2" id="mediaLabel">Upload Media:</span>
                            <input type="file" id="simUpload" accept="image/*,video/*"
                                class="w-full bg-white text-black border-2 border-black p-2 cursor-pointer file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-black file:text-white file:font-bold file:uppercase hover:file:bg-gray-800 transition-all">
                        </div>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="text-sm font-bold uppercase block">Action (Signal)</label>
                        <select id="simSignal" class="w-full bw-input px-4 py-3">
                            <optgroup label="Strongest Positive">
                                <option value="register">Register (Event)</option>
                            </optgroup>
                            <optgroup label="Strong Positive">
                                <option value="comment">Comment</option>
                                <option value="reply">Reply</option>
                                <option value="repost">Repost</option>
                            </optgroup>
                            <optgroup label="Standard Positive">
                                <option value="react" selected>React / Like</option>
                                <option value="save">Save</option>
                                <option value="share">Share</option>
                            </optgroup>
                            <optgroup label="Weak Positive">
                                <option value="open_detail">Open Detail</option>
                                <option value="dwell">Dwell</option>
                            </optgroup>
                            <optgroup label="Negative">
                                <option value="scroll_past">Scroll Past (Weak)</option>
                                <option value="not_interested">Not Interested (Strong)</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="md:col-span-2 pt-4">
                        <button type="submit" id="simBtn" class="w-full bw-button py-4 px-4 text-lg">
                            Simulate & Update
                        </button>
                        <div id="simLog" class="text-sm mt-3 h-5 font-bold"></div>
                    </div>
                </form>
            </div>

            <!-- Fetch Feed Section -->
            <div class="bw-card p-8 flex flex-col justify-center items-center text-center space-y-8">
                <div class="w-full">
                    <h2 class="text-2xl font-black mb-2 uppercase border-b-2 border-black pb-2 text-left">2. Omni-Feed
                    </h2>
                    <p class="text-sm font-bold text-left mt-4">Graph state is persisted. Switching users will load
                        their unique recommendations.</p>
                </div>

                <div class="w-full space-y-2 text-left">
                    <label class="text-sm font-bold uppercase block">Fetch for User ID</label>
                    <input type="text" id="feedUser" value="test_user_1"
                        class="w-full bw-input px-4 py-3 text-center text-lg font-bold">
                </div>

                <button id="fetchFeedBtn" class="w-full bw-button py-4 px-4 text-lg">
                    Generate Feed
                </button>
                <div id="feedLog" class="text-sm font-bold h-5 w-full text-left"></div>
            </div>

        </div>

        <!-- Feed Display -->
        <div id="feedContainer" class="hidden space-y-16 mt-16 pt-8 border-t-4 border-black">
            <!-- Dynamically populated sections go here -->
        </div>

    </div>

    <script>
        const simForm = document.getElementById('simulateForm');
        const simBtn = document.getElementById('simBtn');
        const simLog = document.getElementById('simLog');

        const fetchFeedBtn = document.getElementById('fetchFeedBtn');
        const feedLog = document.getElementById('feedLog');
        const feedUser = document.getElementById('feedUser');
        const feedContainer = document.getElementById('feedContainer');

        const simType = document.getElementById('simType');
        const mediaFieldContainer = document.getElementById('mediaFieldContainer');
        const mediaLabel = document.getElementById('mediaLabel');
        const simUpload = document.getElementById('simUpload');

        // Dynamic Image Field Logic
        function updateFieldsBasedOnType() {
            const type = simType.value;
            // Only show media input for posts
            if (type === 'post') {
                mediaFieldContainer.style.display = 'block';
                mediaLabel.innerText = "Image / Video URL (Post)";
                simUpload.setAttribute("accept", "image/*,video/*");
            } else {
                mediaFieldContainer.style.display = 'none';
                simUpload.value = '';
            }
        }

        simType.addEventListener('change', updateFieldsBasedOnType);
        // Run once on load
        updateFieldsBasedOnType();

        // Render Card Function
        function createCard(item, collection) {
            const data = item.data || {};
            const score = (item.blended_score * 100).toFixed(1);

            // Extract text/title/bio
            let text = data.text || data.description || data.title || data.bio || data.name || "No text available";

            // Special rule for Clubs: Only show the name, no extra description needed!
            if (collection === 'clubs') {
                text = data.name || data.text || "Unknown Club";
            }

            // Extract media
            let imgUrl = data.image_url || data.profile_pic || data.video_url;
            let imgHtml = '';

            if (imgUrl) {
                // If it's a reel or an mp4, render a video tag
                if (collection === 'reels' || imgUrl.endsWith('.mp4') || imgUrl.endsWith('.webm')) {
                    imgHtml = `<div class="border-b-2 border-black bg-black"><video src="${imgUrl}" class="w-full h-48 object-cover" autoplay muted loop playsinline></video></div>`;
                } else {
                    imgHtml = `<div class="border-b-2 border-black"><img src="${imgUrl}" class="w-full h-48 object-cover" loading="lazy"></div>`;
                }
            } else {
                imgHtml = `<div class="w-full h-12 border-b-2 border-black flex items-center justify-center bg-gray-100"><span class="text-xs font-bold uppercase tracking-widest">${collection}</span></div>`;
            }

            return `
                <div class="bw-item-card flex flex-col h-full">
                    ${imgHtml}
                    <div class="p-4 flex-grow flex flex-col justify-between bg-white">
                        <div>
                            <p class="text-sm font-bold line-clamp-3 mb-4">${text}</p>
                        </div>
                        <div class="flex justify-between items-center mt-4 pt-3 border-t-2 border-black">
                            <span class="text-xs font-bold uppercase px-2 py-1 bg-black text-white" title="${item.id}">${item.id.split('_').slice(-1)[0].substring(0, 6)}</span>
                            <span class="text-xs font-black">
                                SCORE ${score}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Simulate Action
        simForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            simBtn.disabled = true;
            simBtn.innerHTML = 'SIMULATING...';
            simLog.innerText = '';
            simLog.className = 'text-sm mt-3 h-5 font-bold text-black';

            // Use FormData for file uploads
            const formData = new FormData();
            formData.append('user_id', document.getElementById('simUser').value);
            formData.append('entity_type', document.getElementById('simType').value);
            formData.append('entity_text', document.getElementById('simText').value);
            formData.append('signal_type', document.getElementById('simSignal').value);


            const fileInput = document.getElementById('simUpload');
            if (fileInput.files.length > 0) {
                formData.append('upload_file', fileInput.files[0]);
            }

            try {
                const res = await fetch('https://shekarss-recommender.hf.space/api/simulate', {
                    method: 'POST',
                    body: formData // No Content-Type header; browser sets multipart/form-data boundary automatically
                });
                const data = await res.json();

                if (res.ok) {
                    simLog.innerText = `SUCCESS: SIGNLED ${data.entity_id}`;
                    feedUser.value = formData.get('user_id'); // Sync feed input
                } else {
                    simLog.innerText = `ERROR: ${data.detail || 'Upload failed'}`;
                }
            } catch (err) {
                simLog.innerText = `ERROR: ${err.message}`;
            } finally {
                simBtn.disabled = false;
                simBtn.innerHTML = 'SIMULATE & UPDATE';
            }
        });

        // Fetch Feed
        fetchFeedBtn.addEventListener('click', async () => {
            const uid = feedUser.value;
            if (!uid) return;

            fetchFeedBtn.disabled = true;
            fetchFeedBtn.innerHTML = 'GENERATING...';
            feedLog.innerText = '';

            try {
                const res = await fetch(`https://shekarss-recommender.hf.space/api/feed/${uid}`);
                const data = await res.json();

                if (data.status === 'error') {
                    feedLog.innerText = `ERROR: ${data.message}`;
                    feedContainer.classList.add('hidden');
                    return;
                }

                feedLog.innerText = `SUCCESS: ${data.pig_clusters} CLUSTERS, ${Object.values(data.feed).flat().length} ITEMS.`;

                // Render feeds
                feedContainer.innerHTML = '';

                // Order to display
                const collections = [
                    { key: 'posts', title: 'Top Posts' },
                    { key: 'events', title: 'Top Events' },
                    { key: 'clubs', title: 'Top Clubs' },
                    { key: 'news', title: 'Top News' },
                    { key: 'brands', title: 'Top Brands' },
                    { key: 'users', title: 'Top Users' }
                ];

                collections.forEach(col => {
                    const items = data.feed[col.key] || [];
                    if (items.length === 0) return;

                    const sectionHtml = `
                        <div class="space-y-6">
                            <h3 class="text-3xl font-black uppercase tracking-tight border-b-4 border-black inline-block pr-8 pb-1">${col.title}</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                ${items.map(i => createCard(i, col.key)).join('')}
                            </div>
                        </div>
                    `;
                    feedContainer.innerHTML += sectionHtml;
                });

                feedContainer.classList.remove('hidden');

            } catch (err) {
                feedLog.innerText = `ERROR: ${err.message}`;
            } finally {
                fetchFeedBtn.disabled = false;
                fetchFeedBtn.innerHTML = 'GENERATE FEED';
            }
        });
    </script>
</body>

</html>
